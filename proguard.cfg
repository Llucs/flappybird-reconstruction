-include proguard-android.txt

-dontwarn android.support.**
-dontwarn com.google.**
-dontwarn org.andengine.**
-dontwarn javax.annotation.**
-dontwarn org.apache.**

-keep,allowobfuscation class com.dotgears.AdHideRunnable { *; }
-keep,allowobfuscation class com.dotgears.AdShowRunnable { *; }
-keep,allowobfuscation class com.dotgears.GameScene { *; }
-keep,allowobfuscation class com.dotgears.BirdAnimation { *; }
-keep,allowobfuscation class com.dotgears.BlinkEntity { *; }
-keep,allowobfuscation class com.dotgears.GameButton { *; }
-keep,allowobfuscation class com.dotgears.GameController { *; }
-keep,allowobfuscation class com.dotgears.BitmapText { *; }
-keep,allowobfuscation class com.dotgears.AtlasRegion { *; }
-keep,allowobfuscation class com.dotgears.MathUtils { *; }
-keep,allowobfuscation class com.dotgears.Medal { *; }
-keep,allowobfuscation class com.dotgears.ScoreNumber { *; }
-keep,allowobfuscation class com.dotgears.GameEntity { *; }
-keep,allowobfuscation class com.dotgears.EntityPool { *; }
-keep,allowobfuscation class com.dotgears.FloatingScore { *; }
-keep,allowobfuscation class com.dotgears.ScorePanel { *; }
-keep,allowobfuscation class com.dotgears.AnimatedEntity { *; }
-keep,allowobfuscation class com.dotgears.Tween { *; }
-keep,allowobfuscation class com.dotgears.flappy.SplashScreen { *; }
-keep,allowobfuscation class com.dotgears.flappy.Bird { *; }
-keep,allowobfuscation class com.dotgears.flappy.BitmapFont { *; }
-keep,allowobfuscation class com.dotgears.flappy.FlappyScene { *; }
-keep,allowobfuscation class com.dotgears.flappy.SplashTransition { *; }
-keep,allowobfuscation class com.dotgears.flappy.GameOverBanner { *; }
-keep,allowobfuscation class com.dotgears.flappy.ReadyBanner { *; }

-keep class com.google.example.games.basegameutils.BaseGameActivity { *; }
-keep,allowobfuscation class com.google.example.games.basegameutils.GameHelper { *; }
-keep,allowobfuscation class com.google.example.games.basegameutils.GameHelperListener { *; }
-keep,allowobfuscation class com.google.example.games.basegameutils.ConnectionFailureInfo { *; }
-keep,allowobfuscation class com.google.example.games.basegameutils.GameHelperResolution { *; }
-keep,allowobfuscation class com.google.example.games.basegameutils.GameHelperResourceIds { *; }
-keep class com.google.ads.** { *; }
-keep class !com.google.android.gms.R*,com.google.android.gms.** { *; }
-keep class android.support.** { *; }
-keep class com.google.analytics.** { *; }
-keep class com.google.tagmanager.** { *; }

-keepclasseswithmembers class * {
    native <methods>;
}

-keep public class * extends android.app.Activity
-keep public class * extends android.view.View
-keep public class * extends android.content.BroadcastReceiver
-keep public class * extends android.app.Service
-keep public class * extends android.content.ContentProvider
-keep public class * implements android.os.Parcelable {
    public static final android.os.Parcelable$Creator *;
}

-keepclassmembers class * {
    public <init>(android.content.Context, android.util.AttributeSet);
}

-keeppackagenames com.dotgears.flappy
-keeppackagenames com.google.example.games.basegameutils
-applymapping proguard-historical.map
